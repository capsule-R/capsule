[package]
name = "capsule-replay-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic replay engine for Capsule AI agent sessions"
license = "Apache-2.0"
repository = "https://github.com/capsule-dev/capsule"

[lib]
name = "capsule_replay"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "capsule-replay"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression
zstd = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Python bindings (optional — enabled for the PyO3 target)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Archive handling
tar = "0.4"

[features]
default = []
python-bindings = ["pyo3"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

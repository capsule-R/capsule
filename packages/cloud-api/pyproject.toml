[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-cloud"
version = "0.1.0"
description = "Capsule Cloud API — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "ulid-py>=1.1.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["capsule_cloud"]
branch = true
omit = [
    "*/capsule_cloud/replay_worker.py",
    "*/capsule_cloud/routers/branches.py",
    "*/capsule_cloud/routers/replays.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "capsule_cloud.auth",
    "capsule_cloud.config",
    "capsule_cloud.database",
    "capsule_cloud.replay_worker",
    "capsule_cloud.schemas",
    "capsule_cloud.storage",
    "capsule_cloud.routers.api_keys",
    "capsule_cloud.routers.auth",
    "capsule_cloud.routers.branches",
    "capsule_cloud.routers.replays",
    "capsule_cloud.routers.sessions",
    "capsule_cloud.routers.workspaces",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "type-arg",
    "untyped-decorator",
    "unused-ignore",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-sdk"
version = "0.1.0"
description = "Deterministic replay & time-travel debugger for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Capsule", email = "sdk@capsule.dev" }]
keywords = ["ai", "agents", "debugging", "replay", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "zstandard>=0.22.0",
    "rich>=13.0.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.28.0"]
google = ["google-generativeai>=0.7.0"]
langchain = ["langchain>=0.2.0", "langchain-core>=0.2.0"]
langgraph = ["langgraph>=0.1.0"]
all = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
capsule = "capsule.cli:main"

[project.urls]
Homepage = "https://capsule.dev"
Documentation = "https://docs.capsule.dev"
Repository = "https://github.com/capsule-dev/capsule"
Issues = "https://github.com/capsule-dev/capsule/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["capsule"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

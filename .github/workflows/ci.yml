name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Python SDK
  # ──────────────────────────────────────────
  sdk-lint:
    name: SDK — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: mypy
        run: mypy --strict src/

  sdk-test:
    name: SDK — Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=capsule --cov-report=xml --cov-fail-under=80

      - name: Run integration tests
        run: pytest tests/integration/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml

  sdk-security:
    name: SDK — Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit & bandit
        run: pip install pip-audit bandit

      - name: pip-audit (dependency CVEs)
        run: pip-audit --requirement requirements.txt || true

      - name: bandit (SAST)
        run: bandit -r src/ -ll

  # ──────────────────────────────────────────
  # Rust Replay Engine
  # ──────────────────────────────────────────
  replay-engine:
    name: Replay Engine — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/replay-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

  # ──────────────────────────────────────────
  # Cloud API (FastAPI)
  # ──────────────────────────────────────────
  cloud-api-lint:
    name: Cloud API — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloud-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: mypy
        run: mypy --strict src/

  cloud-api-test:
    name: Cloud API — Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: capsule_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/cloud-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/capsule_test
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --cov=capsule_cloud --cov-fail-under=80

  # ──────────────────────────────────────────
  # Cloud Web (Next.js)
  # ──────────────────────────────────────────
  cloud-web:
    name: Cloud Web — Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloud-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/cloud-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────
  # Secret scanning
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # PR Summary comment
  # ──────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [sdk-lint, sdk-test, sdk-security, replay-engine, cloud-api-lint, cloud-api-test, cloud-web, secret-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
